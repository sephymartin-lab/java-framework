name: Maven Deploy to Nexus

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: '是否跳过测试'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      enable_debug:
        description: '是否启用调试模式'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: 部署到 Nexus 私服
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          # cache: 'maven'
          # settings-path: .github/workflows/settings.xml

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.12

      - name: Create Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            
            <servers>
              <server>
                <id>sephy-maven-releases</id>
                <username>${{ secrets.MAVEN_USERNAME }}</username>
                <password>${{ secrets.MAVEN_PASSWORD }}</password>
              </server>
              <server>
                <id>sephy-maven-snapshots</id>
                <username>${{ secrets.MAVEN_USERNAME }}</username>
                <password>${{ secrets.MAVEN_PASSWORD }}</password>
              </server>
            </servers>
            
            <profiles>
              <profile>
                <id>sephy</id>
                <properties>
                  <altReleaseDeploymentRepository>
                    sephy-maven-releases::default::https://maven.sephy.top/releases/
                  </altReleaseDeploymentRepository>
                  <altSnapshotDeploymentRepository>
                    sephy-maven-snapshots::default::https://maven.sephy.top/snapshots/
                  </altSnapshotDeploymentRepository>
                </properties>
                <repositories>
                  <repository>
                    <id>sephy-maven-releases</id>
                    <url>https://maven.sephy.top/releases/</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                  </repository>
                  <repository>
                    <id>sephy-maven-snapshots</id>
                    <url>https://maven.sephy.top/snapshots/</url>
                    <snapshots>
                      <enabled>true</enabled>
                      <updatePolicy>always</updatePolicy>
                      <checksumPolicy>warn</checksumPolicy>
                    </snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>sephy-maven-releases</id>
                    <url>https://maven.sephy.top/releases/</url>
                  </pluginRepository>
                  <pluginRepository>
                    <id>sephy-maven-snapshots</id>
                    <url>https://maven.sephy.top/snapshots/</url>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            
            <activeProfiles>
              <activeProfile>sephy</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: 🔍 调试 - 环境信息检查
        if: github.event.inputs.enable_debug == 'true'
        run: |
          echo "========================================="
          echo "🐳 容器环境信息"
          echo "========================================="
          echo "当前用户: $(whoami)"
          echo "工作目录: $(pwd)"
          echo ""

          echo "📌 Java 环境:"
          java -version
          echo "JAVA_HOME: ${JAVA_HOME:-未设置}"
          echo "Java 可执行文件: $(which java)"
          echo ""

          echo "📌 Maven 环境:"
          mvn -version
          echo ""

          echo "========================================="
          echo "📁 Maven 配置检查"
          echo "========================================="
          if [ -d "$HOME/.m2" ]; then
            echo "✅ $HOME/.m2 目录存在"
            ls -lah "$HOME/.m2/" 2>/dev/null || echo "无法列出目录内容"
            echo ""
            
            if [ -f "$HOME/.m2/settings.xml" ]; then
              echo "✅ settings.xml 存在"
              echo "Maven 有效配置（Nexus 相关）:"
              mvn help:effective-settings | grep -A 5 -B 2 -E "sephy-maven|maven\.sephy\.top" || echo "未找到 Maven 私服配置"
            else
              echo "⚠️  settings.xml 不存在"
            fi
            echo ""
            
            if [ -d "$HOME/.m2/repository" ]; then
              echo "✅ Maven 本地仓库存在"
              echo "缓存大小: $(du -sh "$HOME/.m2/repository" 2>/dev/null | cut -f1 || echo '未知')"
            else
              echo "ℹ️  Maven 本地仓库不存在（首次构建会创建）"
            fi
          else
            echo "❌ $HOME/.m2 目录不存在 - 无法创建 Maven 用户目录！"
            exit 1
          fi
          echo "========================================="

      - name: 部署 framework-dependencies
        working-directory: framework-dependencies
        run: |
          echo "========================================="
          echo "🚀 开始部署 framework-dependencies"
          echo "========================================="

          set -o pipefail

          # 根据 enable_debug 参数决定是否添加 -X
          DEBUG_FLAG=""
          if [ "${{ github.event.inputs.enable_debug }}" = "true" ]; then
            DEBUG_FLAG="-X"
            echo "🐛 调试模式已启用"
          fi

          mvn deploy \
            -Dmaven.test.skip=${{ github.event.inputs.skip_tests || 'true' }} \
            -B $DEBUG_FLAG 2>&1 | tee /tmp/maven-deploy-deps.log || {
              echo "❌ 部署失败，查看错误日志:"
              tail -100 /tmp/maven-deploy-deps.log
              exit 1
            }
          echo "✅ framework-dependencies 部署完成"

      - name: 部署 framework-infra
        working-directory: framework-infra
        run: |
          echo "========================================="
          echo "🚀 开始部署 framework-infra"
          echo "========================================="

          set -o pipefail

          # 根据 enable_debug 参数决定是否添加 -X
          DEBUG_FLAG=""
          if [ "${{ github.event.inputs.enable_debug }}" = "true" ]; then
            DEBUG_FLAG="-X"
            echo "🐛 调试模式已启用"
          fi

          mvn deploy \
            -Dmaven.test.skip=${{ github.event.inputs.skip_tests || 'true' }} \
            -B $DEBUG_FLAG 2>&1 | tee /tmp/maven-deploy-infra.log || {
              echo "❌ 部署失败，查看错误日志:"
              tail -100 /tmp/maven-deploy-infra.log
              exit 1
            }
          echo "✅ framework-infra 部署完成"

  notify:
    if: always() && github.ref == 'refs/heads/main'
    name: 发送飞书通知
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify Maven deploy success in Feishu
        if: needs.deploy.result == 'success'
        uses: sephymartin-lab/forge-actions/.github/actions/feishu-notify@main
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK_URL }}
          secret: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          status: success
          title: 'Maven 部署成功'
          summary: '${{ github.repository }} 已成功部署到 Nexus。'
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ref-name: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          workflow: ${{ github.workflow }}
          run-number: ${{ github.run_number }}
          event-name: ${{ github.event_name }}

      - name: Notify Maven deploy failure in Feishu
        if: needs.deploy.result != 'success'
        uses: sephymartin-lab/forge-actions/.github/actions/feishu-notify@main
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK_URL }}
          secret: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          status: failure
          title: 'Maven 部署失败'
          summary: '${{ github.repository }} 部署到 Nexus 失败，请打开 Actions 查看详细错误。'
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ref-name: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          actor: ${{ github.actor }}
          repository: ${{ github.repository }}
          workflow: ${{ github.workflow }}
          run-number: ${{ github.run_number }}
          event-name: ${{ github.event_name }}
